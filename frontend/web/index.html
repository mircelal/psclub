<!DOCTYPE html>

<html>

<head>

  <!--

    href value below to reflect the base path you are serving from.



    The path provided below has to start and end with a slash "/" in order for

    it to work correctly.



    For more details:

    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base



    This is a placeholder for base href that will be replaced by the value of

    the `--base-href` argument provided to `flutter build`.

  -->

  <base href="$FLUTTER_BASE_HREF">



  <meta charset="UTF-8">

  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta name="description" content="A new Flutter project.">



  <!-- iOS meta tags & icons -->

  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <meta name="apple-mobile-web-app-title" content="psclub_pos">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">



  <!-- Favicon -->

  <link rel="icon" type="image/png" href="favicon.png"/>



  <title>psclub_pos</title>

  <link rel="manifest" href="manifest.json">

</head>

<body>

  <!--

    Chrome: köhnə Flutter service worker + Cache API köhnə main.dart.js saxlayır.

    flutter_bootstrap.js YALNIZ SW/cache təmizləndikdən sonra yüklənir (Edge ilə fərq).

  -->

  <script>

    (async function () {

      var BUILD = 'PSCLUB_WEB_3';

      try {

        if (localStorage.getItem('psclub_build') !== BUILD) {

          localStorage.clear();

          sessionStorage.clear();

          localStorage.setItem('psclub_build', BUILD);

        }

        if ('serviceWorker' in navigator) {

          var regs = await navigator.serviceWorker.getRegistrations();

          await Promise.all(regs.map(function (r) { return r.unregister(); }));

        }

        if ('caches' in window) {

          var keys = await caches.keys();

          await Promise.all(keys.map(function (k) { return caches.delete(k); }));

        }

      } catch (e) {

        console.warn('[psclub] cache reset:', e);

      }

      var s = document.createElement('script');

      s.src = 'flutter_bootstrap.js?v=' + encodeURIComponent(BUILD);

      s.async = true;

      document.body.appendChild(s);

    })();

  </script>

</body>

</html>
